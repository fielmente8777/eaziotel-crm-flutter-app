name: eazotel
description: "A new Flutter project."

publish_to: "none"

version: 1.0.4+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # App dependencies
  get: ^4.7.3
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  dio: ^5.11.1
  google_sign_in: ^7.2.0
  change_app_package_name: ^1.5.0
  google_sign_in_web: ^1.1.3
  shimmer: ^3.0.0
  device_preview: ^1.3.1
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.7
  socket_io_client: ^3.1.6
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.6
  image: ^4.5.4
  video_player: ^2.11.1
  audioplayers: ^6.7.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  http_parser: ^4.1.2
  country_picker: ^2.0.28
  flutter_contacts: ^2.1.0
  package_info_plus: ^10.2.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/bottomNavigationIcon/
    - assets/font/
    - assets/icon/
    - assets/image/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-Thin.ttf
          weight: 100
        - asset: assets/font/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Poppins-Light.ttf
          weight: 300
        - asset: assets/font/Poppins-Regular.ttf
          weight: 400
        - asset: assets/font/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/font/Poppins-Bold.ttf
          weight: 700
        - asset: assets/font/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Poppins-Black.ttf
          weight: 900

        # Italic fonts
        - asset: assets/font/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/font/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/font/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/font/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/font/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/font/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/font/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/font/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/font/Poppins-BlackItalic.ttf
          weight: 900
          style: italic